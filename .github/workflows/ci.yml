name: "Build & Test"
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/*'
      - '*.yml'
      - '*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Arturo"
        uses: arturo-lang/setup-arturo@v2
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: |
          arturo -v
          arturo test/tester.art
